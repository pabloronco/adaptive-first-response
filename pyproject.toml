[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-first-response"
version = "0.1.0"
description = "HackMIT rehearsal implementation for adaptive ecological first-response planning."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "networkx>=3.2,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
